<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="512"
   height="512"
   viewBox="0 0 512 512"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="diskGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="mountGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5FD35F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A9A3A;stop-opacity:1" />
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="#F5F5F5" filter="url(#shadow)"/>

  <!-- Hard Disk Body -->
  <g transform="translate(256, 220)">
    <!-- Main disk rectangle -->
    <rect x="-140" y="-80" width="280" height="140" rx="12" ry="12"
          fill="url(#diskGradient)" stroke="#1E3A5F" stroke-width="4"/>

    <!-- Disk details/lines -->
    <line x1="-140" y1="-40" x2="140" y2="-40" stroke="#2E5C8A" stroke-width="2" opacity="0.5"/>
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#2E5C8A" stroke-width="2" opacity="0.5"/>
    <line x1="-140" y1="40" x2="140" y2="40" stroke="#2E5C8A" stroke-width="2" opacity="0.5"/>

    <!-- VHDX Label -->
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="32" font-weight="bold"
          fill="white" text-anchor="middle">VHDX</text>

    <!-- Activity LED -->
    <circle cx="-100" cy="-50" r="8" fill="#FF6B6B"/>
    <circle cx="-80" cy="-50" r="8" fill="#4ECDC4"/>
  </g>

  <!-- Mount/Link Symbol (Arrow pointing into disk) -->
  <g transform="translate(256, 360)">
    <!-- Green circular badge -->
    <circle cx="80" cy="0" r="50" fill="url(#mountGradient)" stroke="#2A7A2A" stroke-width="3"/>

    <!-- Mount arrow/link icon -->
    <path d="M 60,-20 L 100,-20 L 100,0 L 120,0 L 80,30 L 40,0 L 60,0 Z"
          fill="white" stroke="none"/>

    <!-- Checkmark to indicate mounted -->
    <path d="M 70,-5 L 78,5 L 95,-15"
          stroke="white" stroke-width="5" stroke-linecap="round"
          stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Linux Penguin silhouette (small) -->
  <g transform="translate(180, 360)" opacity="0.6">
    <ellipse cx="0" cy="0" rx="20" ry="25" fill="#333333"/>
    <ellipse cx="-8" cy="-8" rx="4" ry="4" fill="white"/>
    <ellipse cx="8" cy="-8" rx="4" ry="4" fill="white"/>
    <ellipse cx="-8" cy="-6" rx="2" ry="2" fill="#333333"/>
    <ellipse cx="8" cy="-6" rx="2" ry="2" fill="#333333"/>
    <path d="M -4,5 Q 0,8 4,5" stroke="#FF8800" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
